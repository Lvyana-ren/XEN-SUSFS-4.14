name: Generate Xen SUSFS 4.14 port candidate

on:
  push:
    branches: [main]
    paths:
      - "tools/generate-port-candidate.sh"
      - "tools/normalize-susfs-candidate.py"
      - "tools/apply-ksun-susfs-compat.py"
      - "patches/susfs-callsite-files.txt"
      - "config/port-refs.env"
      - ".github/workflows/generate-port-candidate.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: xen-susfs-4.14-candidate
  cancel-in-progress: false

jobs:
  generate-candidate:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout patch workspace
        uses: actions/checkout@v4

      - name: Load pinned refs and checkout exact commits
        shell: bash
        run: |
          set -euo pipefail
          source config/port-refs.env

          checkout_pinned_commit() {
            local repo="$1"
            local ref_label="$2"
            local sha="$3"
            local dest="$4"

            echo "::group::Checkout ${repo} @ ${sha}"
            mkdir -p "$dest"
            git -C "$dest" init
            git -C "$dest" remote add origin "https://github.com/${repo}.git"
            git -C "$dest" fetch --no-tags --depth=1 origin "$sha"
            git -C "$dest" checkout --detach FETCH_HEAD

            local actual
            actual=$(git -C "$dest" rev-parse HEAD)
            if [[ "$actual" != "$sha" ]]; then
              echo "::error::Pinned SHA mismatch for ${repo} (${ref_label}): expected ${sha}, got ${actual}"
              exit 1
            fi

            echo "Pinned ref label: ${ref_label}"
            echo "Verified commit: ${actual}"
            echo "::endgroup::"
          }

          checkout_pinned_commit "$BASE_REPO" "$BASE_REF" "$BASE_SHA" "$RUNNER_TEMP/kernel-base"
          checkout_pinned_commit "$TARGET_REPO" "$TARGET_REF" "$TARGET_SHA" "$RUNNER_TEMP/kernel-target"
          checkout_pinned_commit "$FEATURE_REPO" "$FEATURE_REF" "$FEATURE_SHA" "$RUNNER_TEMP/kernel-feature"

          {
            echo "BASE_REPO=$BASE_REPO"
            echo "BASE_REF=$BASE_REF"
            echo "BASE_SHA=$BASE_SHA"
            echo "TARGET_REPO=$TARGET_REPO"
            echo "TARGET_REF=$TARGET_REF"
            echo "TARGET_SHA=$TARGET_SHA"
            echo "FEATURE_REPO=$FEATURE_REPO"
            echo "FEATURE_REF=$FEATURE_REF"
            echo "FEATURE_SHA=$FEATURE_SHA"
            echo "EXPECTED_BASE_SHA=$BASE_SHA"
            echo "EXPECTED_TARGET_SHA=$TARGET_SHA"
            echo "EXPECTED_FEATURE_SHA=$FEATURE_SHA"
          } >> "$GITHUB_ENV"

      - name: Generate and sanitize kernel integration candidate
        shell: bash
        run: |
          set -euo pipefail
          bash tools/generate-port-candidate.sh \
            "$RUNNER_TEMP/kernel-base" \
            "$RUNNER_TEMP/kernel-target" \
            "$RUNNER_TEMP/kernel-feature" \
            "$RUNNER_TEMP/output"

          PATCH="$RUNNER_TEMP/output/xen-susfs-kernel-integration-candidate.patch"
          grep -q 'ksu_handle_setresuid(current_uid().val, ruid)' "$PATCH"
          if grep -E 'ksu_handle_faccessat|ksu_handle_stat' "$PATCH"; then
            echo "::error::Candidate contains duplicate generic hooks that conflict with the Xen manual-hook script."
            exit 1
          fi

          VERIFY_DIR="$RUNNER_TEMP/kernel-verify"
          mkdir -p "$VERIFY_DIR"
          git -C "$VERIFY_DIR" init
          git -C "$VERIFY_DIR" remote add origin "https://github.com/${TARGET_REPO}.git"
          git -C "$VERIFY_DIR" fetch --no-tags --depth=1 origin "$TARGET_SHA"
          git -C "$VERIFY_DIR" checkout --detach FETCH_HEAD
          git -C "$VERIFY_DIR" apply --check "$PATCH"
          echo "PASS: kernel candidate applies to pinned target commit $TARGET_SHA"

          mkdir -p "$GITHUB_WORKSPACE/port-candidate"
          cp -a "$RUNNER_TEMP/output/." "$GITHUB_WORKSPACE/port-candidate/"

      - name: Generate and validate current KSUN compatibility overlay
        shell: bash
        run: |
          set -euo pipefail
          source config/port-refs.env

          KSUN_DIR="$RUNNER_TEMP/KernelSU-Next"
          mkdir -p "$KSUN_DIR"
          git -C "$KSUN_DIR" init
          git -C "$KSUN_DIR" remote add origin "https://github.com/${KSUN_REPO}.git"
          git -C "$KSUN_DIR" fetch --no-tags --depth=1 origin "$KSUN_SHA"
          git -C "$KSUN_DIR" checkout --detach FETCH_HEAD
          ACTUAL="$(git -C "$KSUN_DIR" rev-parse HEAD)"
          test "$ACTUAL" = "$KSUN_SHA" || {
            echo "::error::KSUN SHA mismatch: expected $KSUN_SHA, got $ACTUAL"
            exit 1
          }

          python3 -m py_compile tools/apply-ksun-susfs-compat.py
          python3 tools/apply-ksun-susfs-compat.py "$KSUN_DIR"
          git -C "$KSUN_DIR" diff --check

          grep -q 'config KSU_SUSFS' "$KSUN_DIR/kernel/Kconfig"
          grep -q 'SUSFS_MAGIC' "$KSUN_DIR/kernel/supercall/supercall.c"
          grep -q 'susfs_start_sdcard_monitor_fn' "$KSUN_DIR/kernel/supercall/dispatch.c"
          grep -q 'susfs_is_current_ksu_domain' "$KSUN_DIR/kernel/selinux/selinux.c"
          grep -q 'void try_umount' "$KSUN_DIR/kernel/feature/kernel_umount.c"
          grep -q 'config KSU_MANUAL_HOOK' "$KSUN_DIR/kernel/Kconfig"

          if git -C "$KSUN_DIR" diff --unified=0 -- kernel/Kconfig | grep -E '^-.*(KSU_MANUAL_HOOK|KSU_KPROBES_HOOK|KSU_SYSCALL_TABLE_HOOK)'; then
            echo "::error::Compatibility overlay unexpectedly removed a hook-mode config."
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/ksun-overlay"
          git -C "$KSUN_DIR" diff --binary > "$RUNNER_TEMP/ksun-overlay/ksun-susfs-compat.patch"
          git -C "$KSUN_DIR" diff --stat > "$RUNNER_TEMP/ksun-overlay/diff-stat.txt"
          git -C "$KSUN_DIR" rev-parse HEAD > "$RUNNER_TEMP/ksun-overlay/ksun-source-commit.txt"
          {
            echo "KSUN repo: $KSUN_REPO"
            echo "KSUN commit: $KSUN_SHA"
            echo "Overlay applied to temporary checkout only."
            echo "No KSUN branch was pushed or changed."
            echo "git diff --check: PASS"
            echo "SUSFS Kconfig/API bridge: PASS"
            echo "Domain shim and try_umount export: PASS"
            echo "Manual-hook config preserved."
          } > "$RUNNER_TEMP/ksun-overlay/VALIDATION.txt"

          cp "$RUNNER_TEMP/ksun-overlay/ksun-susfs-compat.patch" "$GITHUB_WORKSPACE/port-candidate/"
          cp "$RUNNER_TEMP/ksun-overlay/VALIDATION.txt" "$GITHUB_WORKSPACE/port-candidate/KSUN-OVERLAY-VALIDATION.txt"

      - name: Save reproducible patches in this repository
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main

          rm -rf patches/generated
          mkdir -p patches/generated patches/ksun
          cp -a "$RUNNER_TEMP/output/." patches/generated/
          cp "$RUNNER_TEMP/ksun-overlay/ksun-susfs-compat.patch" patches/ksun/
          cp "$RUNNER_TEMP/ksun-overlay/VALIDATION.txt" patches/ksun/
          cp "$RUNNER_TEMP/ksun-overlay/diff-stat.txt" patches/ksun/
          cp "$RUNNER_TEMP/ksun-overlay/ksun-source-commit.txt" patches/ksun/

          cat > patches/generated/README.md <<'EOF'
          # Generated Xen SUSFS candidate

          This directory is refreshed by the pinned-reference workflow. The kernel
          patch applies to the exact target SHA listed in reports/input-refs.txt.
          It is a candidate, not a full-build or device-validation claim.

          patches/ksun/ksun-susfs-compat.patch is a separate overlay for the exact
          KSUN SHA recorded in patches/ksun/ksun-source-commit.txt. Apply each
          patch to its own source tree.
          EOF

          git add patches/generated patches/ksun
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "port: save pinned Xen SUSFS kernel and KSUN patches"
            git push origin HEAD:main
          else
            echo "Generated patches in the repository are already current."
          fi

      - name: Upload combined patch bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xen-susfs-4.14-candidate
          path: port-candidate/
          if-no-files-found: warn
          retention-days: 30
